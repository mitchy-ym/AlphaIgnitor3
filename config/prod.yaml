start_date: null
end_date: null
prediction_days: 5
# Chronos-2 / TimesFM / TiREX に渡す close 単系列の過去営業日数。
context_days: 60
# Optuna は直近1年分の walk-forward 方向精度を最大化する。
optuna_window_days: 252
optuna_n_trials: 100
optuna_timeout_minutes: 10
optuna_storage_path: models/ensemble_optuna.sqlite3
prediction_cache_path: cache/zero_shot_predictions.sqlite3
ensemble_models:
  - chronos2
  - timesfm
  - tirex
chronos2_device_map: auto
timesfm_device: auto
tirex_backend: auto
chronos2_batch_size: 96
timesfm_batch_size: 640
tirex_batch_size: 640
min_available_models: 2
optimizer_workers: null
top_n: 10
max_tickers: null
model_root: models
report_outdir: report
